[project]
name = "secrets_app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "litestar[jinja]>=2.10",
    "hypercorn>=0.17",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secrets_app"]
